[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stn-reader"
version = "0.1.0"
description = "Windows desktop reader for .stn (CAD/3D) files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "STN Reader contributors" }]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.scripts]
stn-reader = "stn_reader.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
