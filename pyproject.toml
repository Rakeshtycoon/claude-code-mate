[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stn-reader"
version = "0.1.0"
description = "Desktop 3D viewer for Stone .stn scan files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "claude-code-mate" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[tool.setuptools.packages.find]
include = ["stn_reader*", "viewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
