name: Build Android APK

# Builds an installable Android APK from the web app using Capacitor.
# Runs on GitHub's runners (which have full internet + the Android SDK),
# then uploads the .apk as an artifact and to a "apk-latest" release.
#
# Manual only: this builds *only* when triggered by hand (Actions tab →
# "Run workflow"), so day-to-day code pushes don't rebuild the APK.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies and build
        run: |
          npm install
          npm run build

      - name: Add Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate the app launcher icon
        run: |
          npm install --no-save sharp @capacitor/assets
          node scripts/app-icon.mjs
          npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' || true

      - name: Add the home-screen widget
        run: node scripts/inject-widget.mjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # Sign every build with the same committed debug keystore so new APKs
      # install as an update over the old one and keep the user's data.
      - name: Use the stable debug keystore
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/BusinessDiary.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusinessDiary-apk
          path: out/BusinessDiary.apk

      - name: Publish APK to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Business Diary — latest APK
          body: |
            Debug APK built automatically from the latest code.
            Download **BusinessDiary.apk** below and install it on your Android phone
            (enable "Install unknown apps" for your browser/files app the first time).
          files: out/BusinessDiary.apk
