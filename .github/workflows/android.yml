name: Build Android APK

# Builds an installable Android APK from the web app using Capacitor.
# Runs on GitHub's runners (which have full internet + the Android SDK),
# then uploads the .apk as an artifact and to a "apk-latest" release.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/business-diary-5bQ3Y
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies and build
        run: |
          npm install
          npm run build

      - name: Add Capacitor Android project
        run: |
          npm install --no-save @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6
          npx cap add android
          npx cap sync android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/BusinessDiary.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusinessDiary-apk
          path: out/BusinessDiary.apk

      - name: Publish APK to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Business Diary — latest APK
          body: |
            Debug APK built automatically from the latest code.
            Download **BusinessDiary.apk** below and install it on your Android phone
            (enable "Install unknown apps" for your browser/files app the first time).
          files: out/BusinessDiary.apk
