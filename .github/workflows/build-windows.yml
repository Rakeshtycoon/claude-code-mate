name: build-windows-exe

# Builds the adv-analyzer Windows .exe on a GitHub-hosted Windows runner
# and publishes it as a downloadable artifact. Trigger it manually from
# the Actions tab (Run workflow), or it runs on pushes that touch the
# adv-scanner toolkit.
on:
  workflow_dispatch:
  push:
    branches: ["claude/diamond-galaxy-scanner-cVuPU"]
    paths: ["adv-scanner/**"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: adv-scanner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm packaging/adv-analyzer.spec

      - name: Smoke test
        run: |
          dist\adv-analyzer.exe --help
          dist\adv-analyzer.exe extract --help

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: adv-analyzer-windows
          path: adv-scanner/dist/adv-analyzer.exe
          if-no-files-found: error
