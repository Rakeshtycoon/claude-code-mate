name: Deploy to GitHub Pages

# Builds the web app and publishes it to GitHub Pages so it can be opened in
# any browser and "Added to Home Screen" on iPhone/Android as an app.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/business-diary-5bQ3Y
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'scripts/icons.mjs'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and generate icons
        run: |
          npm install
          npm install --no-save sharp
          node scripts/icons.mjs
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# trigger: redeploy after enabling Pages
