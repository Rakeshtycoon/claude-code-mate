<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- icon background -->
  <rect width="512" height="512" rx="112" fill="#ffffff"/>

  <g transform="rotate(6 256 256)">
    <!-- pages behind the cover -->
    <rect x="176" y="120" width="192" height="298" rx="20" fill="#cbd5e1"/>
    <rect x="168" y="112" width="192" height="298" rx="20" fill="#e2e8f0"/>

    <!-- diary cover -->
    <rect x="158" y="106" width="194" height="298" rx="20" fill="#2563eb" stroke="#1e3a8a" stroke-width="7"/>

    <!-- title bar with a little scribble -->
    <rect x="196" y="146" width="120" height="34" rx="8" fill="#0f172a"/>
    <path d="M206 165 q6 -11 12 0 t12 0 t12 0 t12 0" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>

    <!-- colourful pie chart -->
    <g>
      <path d="M258 300 L258 230 A70 70 0 0 1 327 312 Z" fill="#f59e0b"/>
      <path d="M258 300 L327 312 A70 70 0 0 1 258 370 Z" fill="#16a34a"/>
      <path d="M258 300 L258 370 A70 70 0 0 1 191 277 Z" fill="#38bdf8"/>
      <path d="M258 300 L191 277 A70 70 0 0 1 258 230 Z" fill="#facc15"/>
      <circle cx="258" cy="300" r="70" fill="none" stroke="#0f172a" stroke-width="4.5"/>
    </g>

    <!-- bookmark ribbon -->
    <path d="M250 404 h36 v58 l-18 -15 l-18 15 Z" fill="#ea580c" stroke="#c2410c" stroke-width="2"/>

    <!-- spiral binding rings -->
    <g stroke="#ea580c" stroke-width="10" fill="#ffffff">
      <ellipse cx="158" cy="168" rx="21" ry="14"/>
      <ellipse cx="158" cy="256" rx="21" ry="14"/>
      <ellipse cx="158" cy="344" rx="21" ry="14"/>
    </g>

    <!-- motion lines -->
    <g stroke="#ea580c" stroke-width="8" stroke-linecap="round">
      <line x1="370" y1="150" x2="404" y2="131"/>
      <line x1="384" y1="180" x2="422" y2="170"/>
      <line x1="362" y1="120" x2="384" y2="96"/>
    </g>

    <!-- little dots -->
    <circle cx="330" cy="210" r="3.4" fill="#0f172a"/>
    <circle cx="196" cy="386" r="3.4" fill="#0f172a"/>
    <circle cx="210" cy="372" r="2.6" fill="#0f172a"/>
  </g>
</svg>
